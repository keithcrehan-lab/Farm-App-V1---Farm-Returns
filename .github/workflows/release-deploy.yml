# Farm Return release pipeline — the only route to production (AGENTS.md).
# Every push to the release branch runs typecheck, lint and the full test suite on GitHub
# (any failure not in .github/known-failing-tests.txt blocks it). If they pass, it deploys
# farm-return-pilot to farm-return-pilot-topaz.vercel.app and moves the `deploy/audited`
# marker branch to this commit. The independent audit happens BEFORE the push: no commit
# reaches this branch until an independent reviewer (Codex, or a separate Claude reviewer
# that did not write the change) has audited everything since `deploy/audited` with no
# Critical/High findings. Vercel builds with the project's own environment variables; a
# failed build never replaces the live app. A missing VERCEL_TOKEN fails closed.
name: Release checks and deploy

on:
  push:
    branches: ["release/farm-return-current-2026-11-07"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Generate Next.js route types
        run: npx next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        # Full suite. One retry absorbs load-sensitive UI tests. Any failure not in
        # .github/known-failing-tests.txt (pre-existing, tracked in BLOCKERS.md) blocks release.
        run: |
          npx vitest run --retry=1 --reporter=default --reporter=json --outputFile=/tmp/vitest.json || true
          node scripts/ci/check-test-baseline.mjs /tmp/vitest.json

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_AEDVfh1AUUrf6CBOxw1qQ8og
      VERCEL_PROJECT_ID: prj_G1qM47n7nSmlQYfqr5kI2RI2sWg5
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::VERCEL_TOKEN secret not set."; exit 1; fi
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "### Live: $url (aliased to farm-return-pilot-topaz.vercel.app)" >> "$GITHUB_STEP_SUMMARY"
      - name: Mark this commit as the last deployed (audited) release
        run: |
          git push origin HEAD:refs/heads/deploy/audited
