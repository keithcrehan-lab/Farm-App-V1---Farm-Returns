# Farm Return release pipeline — the only route to production (AGENTS.md).
# Every push to the release branch runs typecheck, lint and the full test suite on GitHub,
# the suite split across six parallel machines (any failure not in
# .github/known-failing-tests.txt blocks it). If they pass, it deploys
# farm-return-pilot to farm-return-pilot-topaz.vercel.app and moves the `deploy/audited`
# marker branch to this commit. The independent audit happens BEFORE the push: no commit
# reaches this branch until an independent reviewer (Codex, or a separate Claude reviewer
# that did not write the change) has audited everything since `deploy/audited` with no
# Critical/High findings. Vercel builds with the project's own environment variables; a
# failed build never replaces the live app. A missing VERCEL_TOKEN fails closed.
name: Release checks and deploy

on:
  push:
    branches: ["release/farm-return-current-2026-11-07"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Typecheck and lint run alongside the tests, not before them.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Packages are restored from cache when package-lock.json is unchanged.
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Generate Next.js route types
        run: npx next typegen
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  # The full suite, split across parallel machines. Each part runs every test in its share,
  # and any failure not in .github/known-failing-tests.txt blocks the release.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}
      - if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund
      - name: Tests (part ${{ matrix.shard }} of 6)
        # One retry absorbs load-sensitive UI tests (pre-existing, tracked in BLOCKERS.md).
        run: |
          set -o pipefail
          code=0; npx vitest run --shard=${{ matrix.shard }}/6 --retry=1 --reporter=default --reporter=json --outputFile=/tmp/vitest.json 2>&1 | tee /tmp/vitest.log || code=$?
          node scripts/ci/check-test-baseline.mjs /tmp/vitest.json "$code" /tmp/vitest.log

  deploy:
    needs: [static, tests]
    # Only the release branch ever reaches production, even from a manual run.
    if: github.ref == 'refs/heads/release/farm-return-current-2026-11-07'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_AEDVfh1AUUrf6CBOxw1qQ8og
      VERCEL_PROJECT_ID: prj_G1qM47n7nSmlQYfqr5kI2RI2sWg5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require an independent audit record for this commit
        # audits/<sha>.md must audit `deploy/audited..<sha>` and end with VERDICT: BLOCKING=0.
        # <sha> is this commit, or its parent when this commit only adds the audit record.
        run: |
          git fetch -q origin deploy/audited
          marker=$(git rev-parse FETCH_HEAD)
          head=$(git rev-parse HEAD); parent=$(git rev-parse HEAD^)
          if [ -f "audits/$head.md" ]; then sha=$head
          elif [ -f "audits/$parent.md" ] && [ -z "$(git diff --name-only HEAD^ HEAD | grep -v '^audits/')" ]; then sha=$parent
          else echo "::error::No audit record audits/<sha>.md for $head. Audit before pushing (AGENTS.md)."; exit 1; fi
          grep -q "Range: $marker..$sha" "audits/$sha.md" || { echo "::error::audits/$sha.md does not cover $marker..$sha"; exit 1; }
          [ "$(grep -v '^\s*$' "audits/$sha.md" | tail -1)" = "VERDICT: BLOCKING=0" ] || { echo "::error::audits/$sha.md has blocking findings"; exit 1; }
          echo "Audit record: audits/$sha.md covers $marker..$sha"
      - name: Deploy to production
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "::error::VERCEL_TOKEN secret not set."; exit 1; fi
          url=$(npx --yes vercel@59.1.3 deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed: $url"
          echo "### Live: $url (aliased to farm-return-pilot-topaz.vercel.app)" >> "$GITHUB_STEP_SUMMARY"
      - name: Mark this commit as the last deployed (audited) release
        run: |
          git push origin HEAD:refs/heads/deploy/audited
