# Tests for the agents' build tooling (scripts/agent-*), not the app. They take about
# 23 minutes, so they run here when the tooling changes instead of on every release.
# Not a deploy gate: nothing in scripts/agent-* ships to the live app.
name: Tooling tests

on:
  push:
    paths:
      - "scripts/agent-*"
      - "src/tooling/**"
      - ".github/workflows/tooling-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Agent tooling tests
        run: npx vitest run src/tooling/agent-run.test.ts
